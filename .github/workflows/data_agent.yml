name: Data Agent

permissions:
  contents: read
  actions: read
  packages: read
  security-events: read

on:
  workflow_dispatch:
    inputs:
      data_id:
        description: Data ID
        required: true
        type: string 
        default: "data"
   
jobs:
  secure-job:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          version: latest
          tags: tag:ci

      - name: Get Ubuntu IP
        shell: powershell
        id: get_ubuntu_ip
        run: |
          $status = tailscale status
          $line = $status | Select-String "ubuntudefault"
          if (-not $line) { Write-Error "Машина ubuntudefault не найдена в сети Tailscale"; exit 1 }
          $ip = ($line.ToString() -split "\s+")[0]
          echo "IP-адрес ubuntudefault: $ip"
          echo "ip=$ip" >> $env:GITHUB_OUTPUT
          # IP доступен в следующих шагах как `${{ steps.get_ubuntu_ip.outputs.ip }}`

      - name: Disconnect Tailscale
        if: always()
        shell: powershell
        run: |
          tailscale logout          
