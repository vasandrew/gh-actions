name: Data Agent

permissions:
  contents: read
  actions: read
  packages: read
  security-events: read

on:
  workflow_dispatch:
    inputs:
      target_host:
        description: Machine name
        required: true
        type: string 
        default: "gh-1"
   
jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          version: latest
          tags: tag:ci

      - name: Get Tailscale IP
        shell: powershell
        run: |
          $ip = tailscale ip -4

          if (-not $ip) {
            Write-Error "Unable to determine Tailscale IP"
            exit 1
          }

          echo "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

      - name: Verify RDP
        shell: powershell
        run: |
          Write-Host "Checking RDP on $env:TAILSCALE_IP..."

          $result = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389

          if (-not $result.TcpTestSucceeded) {
            Write-Error "RDP is not reachable."
            exit 1
          }

          Write-Host "RDP is available."

      - name: Show Tailscale IP
        shell: powershell
        run: |
          tailscale set --hostname=${{ inputs.target_host }}
          Write-Host ""
          Write-Host "=========================="
          Write-Host $env:TAILSCALE_IP
          Write-Host "=========================="

          Add-Content `
            -Path $env:GITHUB_STEP_SUMMARY `
            -Value "## Tailscale IP`n`n$env:TAILSCALE_IP"

      - name: Disconnect Tailscale
        if: always()
        shell: powershell
        run: |
          tailscale logout          