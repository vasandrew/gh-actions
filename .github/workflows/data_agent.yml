name: Data Agent

permissions:
  contents: read
  actions: read
  packages: read
  security-events: read

on:
  workflow_dispatch:
    inputs:
      data_id:
        description: Data ID
        required: true
        type: string 
        default: "data"
   
jobs:
  secure-job:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          version: latest
          tags: tag:ci

      - name: Init scripts
        shell: powershell
        run: |
          $destinationFolder = "D:\myFiles\scripts"
          $zipPath = "$destinationFolder\scripts.zip"
          $url = "http://ubuntudefault:8888/scripts.zip"

          New-Item -ItemType Directory -Force -Path $destinationFolder | Out-Null

          Invoke-WebRequest -Uri $url -OutFile $zipPath

          Expand-Archive -Path $zipPath -DestinationPath $destinationFolder -Force

          Get-Content -Path "$destinationFolder\test.txt"

      - name: Disconnect Tailscale
        if: always()
        shell: powershell
        run: |
          tailscale logout          

      - name: Destroy scripts
        if: always()
        shell: powershell
        run: |
          Remove-Item -Recurse -Force -Path "D:\myFiles"
